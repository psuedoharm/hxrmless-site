<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HXRMLESS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --o: #C94F00;
  --text: #F2E8DC;
  --sub: rgba(242,232,220,0.36);
  --bg: #060300;
}

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  font-family: 'Inter', sans-serif;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 100vh;
}

/* TECHNIQUE 1: Animated mesh gradient orbs (Stripe/Apple aurora style) */
.orbs {
  position: fixed;
  inset: -20%;
  width: 140%; height: 140%;
  z-index: 0;
  filter: blur(90px);
  pointer-events: none;
}

.orb {
  position: absolute;
  border-radius: 50%;
  will-change: transform;
}

.orb1 {
  width: 60vw; height: 60vw;
  background: radial-gradient(ellipse, #9E3800 0%, transparent 68%);
  top: -15%; left: -12%;
  opacity: 0.6;
  animation: drift1 20s ease-in-out infinite;
}
.orb2 {
  width: 45vw; height: 45vw;
  background: radial-gradient(ellipse, #6B2000 0%, transparent 68%);
  bottom: -10%; right: -8%;
  opacity: 0.55;
  animation: drift2 25s ease-in-out infinite;
}
.orb3 {
  width: 32vw; height: 32vw;
  background: radial-gradient(ellipse, #D45A00 0%, transparent 68%);
  top: 28%; left: 52%;
  opacity: 0.28;
  animation: drift3 17s ease-in-out infinite;
}
.orb4 {
  width: 28vw; height: 28vw;
  background: radial-gradient(ellipse, #4A1500 0%, transparent 68%);
  top: 52%; left: 12%;
  opacity: 0.5;
  animation: drift4 28s ease-in-out infinite;
}

@keyframes drift1 {
  0%   { transform: translate(0,0) scale(1); }
  30%  { transform: translate(9vw,7vh) scale(1.07); }
  65%  { transform: translate(-5vw,11vh) scale(0.94); }
  100% { transform: translate(0,0) scale(1); }
}
@keyframes drift2 {
  0%   { transform: translate(0,0) scale(1); }
  25%  { transform: translate(-7vw,-9vh) scale(1.1); }
  75%  { transform: translate(5vw,-5vh) scale(0.91); }
  100% { transform: translate(0,0) scale(1); }
}
@keyframes drift3 {
  0%   { transform: translate(0,0) scale(1); }
  40%  { transform: translate(-11vw,6vh) scale(1.14); }
  80%  { transform: translate(6vw,-9vh) scale(0.87); }
  100% { transform: translate(0,0) scale(1); }
}
@keyframes drift4 {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(8vw,-7vh) scale(1.06); }
  100% { transform: translate(0,0) scale(1); }
}

/* TECHNIQUE 2: Lerp mouse-tracking soft spotlight */
.spotlight {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  will-change: background;
}

/* Content */
.content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 2rem;
}

/* Avatar with spinning conic ring */
.av-wrap {
  position: relative;
  margin-bottom: 2.2rem;
  width: 82px; height: 82px;
}
.av-wrap::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #C94F00, #3D1600, #E06010, #C94F00);
  animation: ring-spin 7s linear infinite;
  opacity: 0.6;
}
.av-wrap::after {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  background: var(--bg);
}
@keyframes ring-spin {
  to { transform: rotate(360deg); }
}
.av {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  z-index: 1;
  background: #1a0a04;
}
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Name */
h1 {
  font-size: clamp(3.8rem, 11vw, 7.5rem);
  font-weight: 900;
  letter-spacing: -0.045em;
  line-height: 0.93;
  color: var(--text);
  margin-bottom: 0.6rem;
}
h1 em {
  font-style: normal;
  color: transparent;
  -webkit-text-stroke: 1.5px rgba(242,232,220,0.4);
}

/* Subtitle */
.sub {
  font-size: 0.77rem;
  font-weight: 400;
  letter-spacing: 0.09em;
  text-transform: lowercase;
  color: var(--sub);
  margin-bottom: 3rem;
}

/* Links */
.links {
  display: flex;
  flex-direction: column;
  gap: 0.48rem;
  width: 236px;
}
.lnk {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.74rem 1.1rem;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-decoration: none;
  color: rgba(242,232,220,0.7);
  border-radius: 11px;
  border: 1px solid rgba(242,232,220,0.06);
  background: rgba(242,232,220,0.028);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
}
.lnk:hover {
  background: rgba(190,68,0,0.13);
  border-color: rgba(200,78,0,0.38);
  color: #F5C9A2;
  transform: scale(1.025);
}
.lnk-l { display: flex; align-items: center; gap: 0.58rem; }
.lnk svg { width: 14px; height: 14px; opacity: 0.6; flex-shrink: 0; }
.lnk:hover svg { opacity: 1; }
.arr { opacity: 0.22; font-size: 0.68rem; transition: opacity .2s, transform .2s; }
.lnk:hover .arr { opacity: 0.65; transform: translateX(2px); }

@media (max-width: 480px) {
  h1 { font-size: 3.4rem; }
  .links { width: 210px; }
}
</style>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

</div>

<div class="content">

  <h1>HXRM<em>LESS</em></h1>

<script>
  const spl = document.getElementById('spl');
  let mx = innerWidth / 2, my = innerHeight / 2;
  let cx = mx, cy = my;

  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  (function tick() {
    cx += (mx - cx) * 0.055;
    cy += (my - cy) * 0.055;
    spl.style.background =
      `radial-gradient(520px circle at ${cx}px ${cy}px, rgba(195,75,0,0.08) 0%, transparent 72%)`;
    requestAnimationFrame(tick);
  })();
</script>

</html>
