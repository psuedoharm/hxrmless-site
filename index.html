<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hxrmless</title>
  <style>
    :root {
      --text: #e0d3f7;
    }
    html, body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
      color: var(--text);
      position: relative;
    }
    .hero {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      perspective: 1200px;
      text-align: center;
    }
    .content {
      transform-style: preserve-3d;
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .circle {
      background: #b8a1e3;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: pulse 4s infinite ease-in-out;
      margin-top: 30px;
      margin-bottom: 1rem;
    }
    .circle img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      animation: pulse 4s infinite ease-in-out;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.03);} }
    h1 { font-size: 4rem; margin-bottom: 0.25rem; }
    p { font-size: 1.2rem; margin-bottom: 1rem; }
    .badges { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .badge {
      display: inline-flex; align-items: center;
      background: rgba(255,255,255,0.1);
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 1rem;
      text-decoration: none;
      color: var(--text);
      backdrop-filter: blur(5px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      transition: background .3s, transform .3s;
      cursor: pointer;
    }
    .badge img {
      width: 20px;
      height: 20px;
      margin-right: 0.6rem;
      object-fit: contain;
    }
    .badge:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
    .about-animated { animation: bobble 3s ease-in-out infinite; }
    .about-title-animated { animation: bobble-title 3s ease-in-out infinite; }
    @keyframes bobble { 0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);} }
    @keyframes bobble-title { 0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);} }
    @media screen and (max-width: 768px) {
      .circle { width: 180px; height: 180px; margin-bottom: 0.5rem; }
      .circle img { width: 120px; height: 120px; }
      h1 { font-size: 2.5rem; margin-bottom: 0.25rem; }
      p { font-size: 1rem; margin-bottom: 1rem; }
      .badge { padding: 0.4rem 0.8rem; font-size: 0.9rem; }
      .badge img { width: 20px !important; height: 20px !important; }
      .about-animated { font-size: 0.9rem; padding: 0 1rem; }
      .hero { height: auto; padding-bottom: 2rem; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="content" id="tilt">
      <div class="circle"><img src="hxrmful_cropped_falafel.png" alt="hxrmful"></div>
      <h1>HXRMLESS</h1>
      <p style="font-weight: bold;">Join the HXRM fam!</p>
      <div class="badges">
        <a class="badge tiktok" href="https://www.tiktok.com/@hxrm_less" target="_blank"><img src="tiktok.png" alt="TikTok"> TikTok</a>
        <a class="badge youtube" href="https://www.youtube.com/@hxrm_less" target="_blank"><img src="youtube.png" alt="YouTube"> YouTube</a>
        <a class="badge discord" href="https://discord.gg/Ddhaj2aSVB" target="_blank"><img src="discord.png" alt="Discord"> Discord</a>
      </div>
      <div style="height: 1%;"></div>
   
      <div style="max-width:600px; padding: 0.5rem 1rem; text-align:center; font-size:1rem; line-height:1.6;">
        <h2 class="about-title-animated" style="margin-bottom: 0rem;">About Me</h2>
        <p class="about-animated">I love Ratatouille. Fun fact: My favorite object is a default cube.</p>
      </div>
    </div>
  </div>
  <script>
    const tilt = document.getElementById('tilt');
    document.addEventListener('mousemove', e => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      tilt.style.transform = `rotateX(${-y * 0.75}deg) rotateY(${x * 0.75}deg)`;
    });
  </script>
</body>
</html>
